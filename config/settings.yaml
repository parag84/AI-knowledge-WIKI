# Run-level settings. Every value can be overridden from the CLI where noted.
fetch:
  backfill_days: 30          # first run only (or --backfill-days)
  overlap_hours: 24          # re-check this much before the last successful run, so late-indexed uploads aren't missed
  min_duration_seconds: 180  # skip Shorts and clips under 3 minutes
analysis:
  max_videos_per_run: 40     # spend cap (or --max-videos); leftovers stay pending for next week
  max_transcript_attempts: 4 # weeks to keep retrying a video whose transcript can't be fetched
llm:
  model: claude-opus-5-5     # e.g. claude-sonnet-5-5 or claude-haiku-5-5 to cut cost
  effort: medium             # low | medium | high
  max_tokens: 16000
  fallbacks: default         # server-side refusal fallback; set to null to turn off
freshness:
  stale_after_days: 90       # unreinforced active insights become `stale`
  archive_after_days: 180    # unreinforced insights move to knowledge/archive/
visuals:
  thumbnail_width: 480
  max_kb: 150
  keyframes:
    enabled: false           # needs video download (yt-dlp + ffmpeg); often blocked on GitHub runners
    max_frames: 4
    keywords: [talk, keynote, workshop, deep dive, architecture, walkthrough, slides, tutorial, explained]
site:
  title: AI Video Knowledge Hub
