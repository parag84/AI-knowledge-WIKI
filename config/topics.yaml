# Controlled topic taxonomy. Claude may only tag insights with slugs listed under `topics`.
# New topics Claude suggests land in `proposed_topics`; move an entry up into `topics` to approve it,
# or delete it to reject it.
topics:
  - slug: agents
    name: Agents
    description: Agent architectures, planning, memory, multi-agent orchestration, agent frameworks.
  - slug: evals
    name: Evals
    description: Evaluating models and agents, benchmarks, LLM-as-judge, regression testing.
  - slug: rag
    name: RAG & retrieval
    description: Retrieval-augmented generation, embeddings, search, context engineering over documents.
  - slug: mcp-tools
    name: MCP & tools
    description: Model Context Protocol, tool use, function calling, connectors, agent-to-tool interfaces.
  - slug: coding-agents
    name: Coding agents
    description: AI coding assistants and agents (Claude Code, Codex, Gemini CLI, etc.), dev workflows.
  - slug: ux-for-ai
    name: UX for AI
    description: Interaction design for AI and agentic products, trust, transparency, generative UI, AX.
  - slug: infra-cost
    name: Infra & cost
    description: Serving, latency, caching, pricing, deployment, observability, cost control.
  - slug: model-releases
    name: Model releases
    description: New model launches, capabilities, versions, deprecations, API changes.
  - slug: startups-product
    name: Startups & product
    description: Product strategy, go-to-market, case studies, building AI companies.
  - slug: agent-memory
    name: Agent memory & context
    description: Persistent cross-session memory, context compaction and context engineering for agents.
  - slug: ai-security
    name: AI security
    description: Agent containment and sandboxing, prompt injection, credentials for agents, AI-driven vulnerability discovery.
proposed_topics:
- slug: local-ai
  name: Local & on-device AI
  why: Running models on owned hardware (quantization, inference engines, consumer GPUs) is a recurring theme not captured
    by infra-cost alone.
  first_seen_in: GKSQYbELDzw
- slug: on-device-ai
  name: On-device / Web AI
  why: Client-side inference in browsers and devices (WebGPU, WebNN, LiteRT) is a recurring theme with distinct UX, privacy
    and cost tradeoffs that no current topic covers.
  first_seen_in: ugmCis5nuF8
- slug: ai-safety-governance
  name: AI safety & release governance
  why: Covers staged or restricted model releases, safety research publication and corporate governance structures like PBCs,
    which none of the existing slugs capture.
  first_seen_in: sof3vW4mHTs
- slug: semantic-layer-grounding
  name: Semantic layers & data governance for agents
  why: Grounding agents on governed business definitions, lineage and PII policies is a distinct enterprise-data theme not
    well covered by RAG or tools alone.
  first_seen_in: QsGQQYj1vEY
- slug: i18n-accessibility
  name: Internationalization & accessibility for AI
  why: Multiple talks (MCP i18n SEP, multilingual voice-first users, GBV survivors' coded language) treat language and accessibility
    as first-class agent design concerns not covered by ux-for-ai alone.
  first_seen_in: BOlf10RUB4s
- slug: agent-experience-dx
  name: Agent experience for tools (AX for CLIs/APIs)
  why: Several talks treat agents as the primary users of CLIs, MCP servers and docs (pipe tax, agent mode, skill.md as interface),
    a design discipline distinct from UX for human users of AI.
  first_seen_in: y9JtCCZP2MQ
- slug: decision-models
  name: Decision / system-one models
  why: Several talks centre on a new class of single-forward-pass classifier models (Jev, Clef, Cleric, Gemini Decisions API)
    that are distinct from generative LLMs and drive routing, judging and intent-detection patterns.
  first_seen_in: ZZ19zhYnDKY
- slug: spec-driven-development
  name: Spec-driven development
  why: Writing and verifying specs/requirements as the primary artifact handed to coding agents is a recurring theme not cleanly
    covered by coding-agents or evals.
  first_seen_in: 0EnLxIbAvYk
- slug: realtime-multimodal
  name: Real-time multimodal agents
  why: Live voice/vision streaming agents with interruption and frame handling are a distinct architectural and UX theme not
    fully covered by agents or ux-for-ai.
  first_seen_in: gg-gXO0tIUY
- slug: voice-agents
  name: Voice agents
  why: Full-duplex voice interfaces over agent backends are a distinct design and engineering area that the current taxonomy
    only partly covers.
  first_seen_in: jDxKzlGLCas
