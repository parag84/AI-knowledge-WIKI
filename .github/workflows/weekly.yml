name: Weekly knowledge update

# The update job runs on Parag's own Windows PC (a self-hosted runner labelled `knowledge-hub`),
# because YouTube blocks transcript downloads from GitHub's servers. If the PC is off at the
# scheduled time, the job waits in the queue for up to 24 hours and starts when the PC comes online.
on:
  schedule:
    - cron: "0 19 * * 0" # Sundays 19:00 UTC (19:00 Irish winter time, 20:00 Irish summer time)
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Look back N days instead of since the last run (e.g. 30 for the first backfill)"
        required: false
        default: ""
      max_videos:
        description: "Cap on videos analysed this run (default from config/settings.yaml)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: [self-hosted, knowledge-hub]
    timeout-minutes: 180
    defaults:
      run:
        shell: bash # Git Bash on Windows
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Python comes from the PC (installed for all users, on PATH); a fresh venv keeps it isolated.
      - name: Python environment
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then PY="$PWD/.venv/Scripts/python.exe"; else PY="$PWD/.venv/bin/python"; fi
          "$PY" -m pip install -q --upgrade pip
          "$PY" -m pip install -q -r requirements.txt
          echo "PY=$PY" >> "$GITHUB_ENV"

      # Transcripts live only in this cache (never committed or published).
      - uses: actions/cache@v4
        with:
          path: .cache
          key: transcripts-${{ github.run_id }}
          restore-keys: transcripts-

      - name: Run pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSCRIPT_PROXY_URL: ${{ secrets.TRANSCRIPT_PROXY_URL }}
          BACKFILL_DAYS: ${{ inputs.backfill_days }}
          MAX_VIDEOS: ${{ inputs.max_videos }}
        run: |
          args=()
          [ -n "$BACKFILL_DAYS" ] && args+=(--backfill-days "$BACKFILL_DAYS")
          [ -n "$MAX_VIDEOS" ] && args+=(--max-videos "$MAX_VIDEOS")
          "$PY" -m hub run --summary-out "$RUNNER_TEMP/summary.json" "${args[@]}"

      - name: Commit results
        run: |
          git config user.name "knowledge-hub-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data knowledge digests config/topics.yaml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            msg=$("$PY" -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['commit_message'])" "$RUNNER_TEMP/summary.json")
            git commit -m "$msg"
            git push origin HEAD:main
          fi

      - name: Open or update the digest issue
        uses: actions/github-script@v7
        env:
          SUMMARY: ${{ runner.temp }}/summary.json
        with:
          script: |
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync(process.env.SUMMARY, 'utf8'));
            const body = fs.readFileSync(s.digest, 'utf8');
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'digest', color: '3B4CCA',
                description: 'Weekly knowledge digest' });
            } catch (e) { /* label already exists */ }
            const issues = await github.paginate(github.rest.issues.listForRepo,
              { owner, repo, labels: 'digest', state: 'all', per_page: 100 });
            const existing = issues.find(i => i.title === s.digest_title);
            if (existing) {
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: s.digest_title, labels: ['digest'], body });
            }

  deploy:
    needs: update
    uses: ./.github/workflows/pages.yml
